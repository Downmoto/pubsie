name: CI

on:
  push:
    branches:
      - v2
  pull_request:
    branches:
      - main

jobs:
  test-and-format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run Prettier and push if on v2 and tests passed
        if: github.ref == 'refs/heads/v2' && success()
        run: |
          npx prettier --write .
          if [[ `git status --porcelain` ]]; then
            git config --global user.name 'github-actions[bot]'
            git config --global user.email 'github-actions[bot]@users.noreply.github.com'
            git add .
            git commit -m 'chore: format code with Prettier [auto-commit]'
            git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git v2
          fi
